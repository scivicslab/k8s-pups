# Two screens behind the one port (8080) that the controller proxies for this tool:
#   /editor/  the code editor (code-server, 127.0.0.1:8443)
#   /         code-raptor (127.0.0.1:8081)
# The controller removes /pups-with-audit/session/<id> before the request arrives, and sends the browser's host in
# X-Forwarded-Host (code-server compares the Origin of a WebSocket with the host it is told).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Redirects stay relative: the browser's address is not the Pod's.
    absolute_redirect off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
    map $http_x_forwarded_host $browser_host {
        default $http_x_forwarded_host;
        ''      $http_host;
    }

    server {
        listen 8080;
        client_max_body_size 0;

        location = /editor {
            return 301 editor/;
        }

        location /editor/ {
            proxy_pass http://127.0.0.1:8443/;
            proxy_http_version 1.1;
            proxy_set_header Host $browser_host;
            proxy_set_header X-Forwarded-Host $browser_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $browser_host;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
