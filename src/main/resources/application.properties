# Application
quarkus.application.name=k8s-pups
quarkus.http.port=8080
quarkus.http.root-path=${BASE_PATH:/pups}

# Proxy: trust X-Forwarded-* headers from HAProxy/Envoy Gateway
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true

# OIDC (Keycloak)
quarkus.oidc.enabled=true
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:https://10.0.0.25/sc-account-keycloak/realms/sc-account}
quarkus.oidc.client-id=k8s-pups
quarkus.oidc.credentials.secret=${K8S_PUPS_OIDC_SECRET}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.redirect-path=${BASE_PATH:/pups}/dashboard
quarkus.oidc.token.refresh-expired=true
# Override OIDC endpoint paths so all server-to-server requests use the
# internal auth-server-url instead of the external URLs from OIDC discovery.
# Without this, the pod sends requests to https://10.0.0.25 which HAProxy
# may route to a different Keycloak set (Blue/Green source-IP routing).
quarkus.oidc.token-path=/protocol/openid-connect/token
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.authentication.session-age-extension=PT2H
quarkus.tls.trust-all=true

# HTTP Auth Permissions (order: specific paths first)
quarkus.http.auth.permission.public.paths=/,/favicon.svg
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.health.paths=/q/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.authenticated.paths=/dashboard,/session/*,/storage/*,/logout,/datasets,/datasets/*,/settings,/settings/*,/security,/security/*,/storage-admin,/storage-admin/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# Logging
quarkus.log.category."com.scivicslab".level=INFO

# Kubernetes Client
quarkus.kubernetes-client.trust-certs=true

# Catalog imports upload CSV files with up to millions of lines
quarkus.http.limits.max-body-size=1G

# k8s-pups configuration
# Container registry host for tool images. Plugins use the ${REGISTRY} placeholder in their default
# image; ToolImageResolver substitutes this value. Set the real registry per deployment via the
# K8SPUPS_REGISTRY env (in the private overlays repo); the default here is a neutral placeholder.
k8spups.registry=${K8SPUPS_REGISTRY:registry.example:5000}
# exdb2 tool's internal service endpoints (real values injected per deployment via env).
k8spups.exdb2.yomitoku-url=${K8SPUPS_EXDB2_YOMITOKU_URL:http://yomitoku:8013}
k8spups.exdb2.embedding-url=${K8SPUPS_EXDB2_EMBEDDING_URL:http://embedding:8012}
k8spups.user-pods-namespace=${K8SPUPS_USER_PODS_NAMESPACE:user-pods}
k8spups.display-name=${K8SPUPS_DISPLAY_NAME:k8s-pups}
k8spups.session-path-prefix=${K8SPUPS_SESSION_PATH_PREFIX:}
k8spups.chat-ui-audit-trail.servers=${K8SPUPS_CHAT_UI_AUDIT_TRAIL_SERVERS:http://gpu-broker:28005}
k8spups.chat-ui-audit-trail.default-model=${K8SPUPS_CHAT_UI_AUDIT_TRAIL_DEFAULT_MODEL:}
k8spups.code-raptor.broker-url=${K8SPUPS_CODE_RAPTOR_BROKER_URL:}
k8spups.code-raptor.model=${K8SPUPS_CODE_RAPTOR_MODEL:}
k8spups.ai-chat.base-url=${K8SPUPS_AI_CHAT_BASE_URL:http://gpu-broker:28005/v1}
k8spups.ai-chat.default-model=${K8SPUPS_AI_CHAT_DEFAULT_MODEL:}
k8spups.file-browser.view-only=${K8SPUPS_FILE_BROWSER_VIEW_ONLY:false}
k8spups.jupyter-ai.base-url=${K8SPUPS_JUPYTER_AI_BASE_URL:http://gpu-broker:28005/v1}
k8spups.jupyter-ai.model=${K8SPUPS_JUPYTER_AI_MODEL:}
k8spups.controller-namespace=${K8SPUPS_CONTROLLER_NAMESPACE:k8s-pups}
k8spups.httproute-namespace=${K8SPUPS_HTTPROUTE_NAMESPACE:sc-account-bg}
k8spups.gateway-names=${K8SPUPS_GATEWAY_NAMES:sc-account-set1-gateway,sc-account-set2-gateway}
k8spups.storage-size-options=${K8SPUPS_STORAGE_SIZE_OPTIONS:20Gi,50Gi,100Gi,500Gi,1Ti}
k8spups.default-storage-size=${K8SPUPS_DEFAULT_STORAGE_SIZE:50Gi}
k8spups.storage-type-options=${K8SPUPS_STORAGE_TYPE_OPTIONS:posix,longhorn}
k8spups.default-storage-type=${K8SPUPS_DEFAULT_STORAGE_TYPE:posix}
# Storage a user gets at the first login without an administrator's action, <type>:<size> (e.g. posix:50Gi).
# Empty: users get storage only from an administrator. Users can never create storage themselves.
k8spups.storage.default-allocation=${K8SPUPS_DEFAULT_ALLOCATION:}
# S3 endpoint shown to users in Storage Settings (for example minio.minio.svc.cluster.local:9000). Unset: no S3 section.
k8spups.object-storage-endpoint=${K8SPUPS_OBJECT_STORAGE_ENDPOINT:}
k8spups.longhorn.storage-class=${K8SPUPS_LONGHORN_STORAGE_CLASS:longhorn-single}
# How the shared file storage (posix) is provided: nfs (directories on an NFS server, k8spups.posix.nfs-*) or
# storage-class (a volume from the StorageClass k8spups.posix.storage-class).
k8spups.posix.backend=${K8SPUPS_POSIX_BACKEND:nfs}
k8spups.posix.storage-class=${K8SPUPS_POSIX_STORAGE_CLASS:}
# User ID and group ID of the tool Pods, replacing the user ID each tool plugin names (usually 1000).
# Set both or neither: K8SPUPS_TOOL_POD_UID and K8SPUPS_TOOL_POD_GID (read as k8spups.tool-pod.uid / .gid).
# The StorageClass of the home PVCs must create the PV directory owned by the same numbers.
k8spups.idle-timeout-minutes=${K8SPUPS_IDLE_TIMEOUT_MINUTES:1440}
k8spups.max-lifetime-minutes=${K8SPUPS_MAX_LIFETIME_MINUTES:10080}
k8spups.max-sessions=${K8SPUPS_MAX_SESSIONS:100}
k8spups.max-sessions-per-user=${K8SPUPS_MAX_SESSIONS_PER_USER:2}
k8spups.unlimited-users=${K8SPUPS_UNLIMITED_USERS:admin}
k8spups.enabled-plugins=${K8SPUPS_ENABLED_PLUGINS:}

# Shared services: cluster-wide Deployments (one per cluster, not per user) shown as a card with
# their state and an Open button for everyone, and Launch / Stop for administrators. The names
# listed here are enabled; each is described by k8spups.shared-service.<name>.* below.
k8spups.shared-services=${K8SPUPS_SHARED_SERVICES:}
k8spups.shared-service.gpu-broker.display-name=GPU Broker
k8spups.shared-service.gpu-broker.description=quarkus-gpu-broker: the one queue in front of the cluster's GPU services (vLLM, embedding, OCR, Whisper). Every tool's LLM calls go through it.
k8spups.shared-service.gpu-broker.namespace=${K8SPUPS_SHARED_SERVICE_GPU_BROKER_NAMESPACE:gpu-broker}
k8spups.shared-service.gpu-broker.deployment=${K8SPUPS_SHARED_SERVICE_GPU_BROKER_DEPLOYMENT:gpu-broker}
k8spups.shared-service.gpu-broker.service=${K8SPUPS_SHARED_SERVICE_GPU_BROKER_SERVICE:gpu-broker}
k8spups.shared-service.gpu-broker.port=${K8SPUPS_SHARED_SERVICE_GPU_BROKER_PORT:28005}
# Who may Launch / Stop a shared service: user ids, or Keycloak roles.
k8spups.admin-users=${K8SPUPS_ADMIN_USERS:}
k8spups.admin-roles=${K8SPUPS_ADMIN_ROLES:admin}
# Per-tool image overrides (mounted ConfigMap, key=plugin name). Read at Pod creation
# so updating a tool image needs no controller restart. Missing file/key falls back to
# the plugin's compiled-in default. See ToolImageReferencing_260630_oo01.
k8spups.tool-images-file=${K8SPUPS_TOOL_IMAGES_FILE:/etc/k8s-pups/tool-images.properties}

# Envoy Gateway SecurityPolicy OIDC config for session routes
k8spups.session-oidc.issuer=${K8SPUPS_SESSION_OIDC_ISSUER:https://10.0.0.25/sc-account-keycloak/realms/sc-account}
k8spups.session-oidc.authorization-endpoint=${K8SPUPS_SESSION_OIDC_AUTHORIZATION_ENDPOINT:https://10.0.0.25/sc-account-keycloak/realms/sc-account/protocol/openid-connect/auth}
k8spups.session-oidc.token-endpoint=${K8SPUPS_SESSION_OIDC_TOKEN_ENDPOINT:http://keycloak-set2.sc-account-bg.svc:8080/sc-account-keycloak/realms/sc-account/protocol/openid-connect/token}
k8spups.session-oidc.client-id=k8s-pups
k8spups.session-oidc.secret-name=k8s-pups-oidc-secret
# Use internal cluster URL for JWKS so Envoy Gateway can fetch without TLS issues
k8spups.session-oidc.jwks-uri=${K8SPUPS_SESSION_OIDC_JWKS_URI:http://keycloak-set2.sc-account-bg.svc:8080/sc-account-keycloak/realms/sc-account/protocol/openid-connect/certs}
k8spups.session-oidc.redirect-base-url=${K8SPUPS_SESSION_OIDC_REDIRECT_BASE_URL:https://10.0.0.25}

# NFS server of the shared file storage (storage type posix) when k8spups.posix.backend is nfs
k8spups.posix.nfs-server=${K8SPUPS_POSIX_NFS_SERVER:10.0.0.20}
k8spups.posix.nfs-base-path=${K8SPUPS_POSIX_NFS_BASE_PATH:/Public/k8s-pups-data}
# English Toolkit AI Chat default model (empty = first model the broker lists).
k8spups.english-toolkit.chat-model=${K8SPUPS_ENGLISH_TOOLKIT_CHAT_MODEL:}

# The controller's PostgreSQL: the storage administrators give to users (storage_allocation), the mounts users chose
# per tool, the dataset entitlement list and the audit trail. Every instance needs it: users get storage only through
# an administrator's allocation, so an instance without the database cannot give anyone storage and must not start.
# K8SPUPS_DB_*; the earlier names K8SPUPS_DATASET_DB_* are still read.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.active=${K8SPUPS_DB_ACTIVE:${K8SPUPS_DATASET_DB_ACTIVE:true}}
quarkus.datasource.jdbc.url=${K8SPUPS_DB_URL:${K8SPUPS_DATASET_DB_URL:jdbc:postgresql://localhost:5432/entitlement}}
quarkus.datasource.username=${K8SPUPS_DB_USER:${K8SPUPS_DATASET_DB_USER:entitlement}}
quarkus.datasource.password=${K8SPUPS_DB_PASSWORD:${K8SPUPS_DATASET_DB_PASSWORD:unused}}
quarkus.flyway.active=${K8SPUPS_DB_ACTIVE:${K8SPUPS_DATASET_DB_ACTIVE:true}}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
# NFS location of the datasets: original files under <base-path>/<original-dir>, per-user views of
# hardlinks under <base-path>/<view-dir>/<user>. Both must be on the same file system.
k8spups.dataset.nfs-server=${K8SPUPS_DATASET_NFS_SERVER:10.0.0.10}
k8spups.dataset.base-path=${K8SPUPS_DATASET_BASE_PATH:/Public/datasets}
k8spups.dataset.original-dir=${K8SPUPS_DATASET_ORIGINAL_DIR:original}
k8spups.dataset.view-dir=${K8SPUPS_DATASET_VIEW_DIR:view}
# Whole datasets are mounted at <mount-path>/<dataset>; the files granted one by one at <files-mount-path>.
k8spups.dataset.mount-path=${K8SPUPS_DATASET_MOUNT_PATH:/datasets}
k8spups.dataset.files-mount-path=${K8SPUPS_DATASET_FILES_MOUNT_PATH:/dataset-files}
# Group that owns the restricted dataset files; the Pods that mount a dataset get it as a supplemental group (empty = none).
k8spups.dataset.gid=${K8SPUPS_DATASET_GID:}

# Passport support (GA4GH): datasets granted by the Visas of a user's Passport are added to the datasets of the
# entitlement database. Off by default. The Passport of a user is fetched from passport-url ({sub} is the user name)
# and every Visa is checked with the public key at jwks-uri of the trusted issuer. A Visa whose value is the
# dataset-prefix followed by a dataset name grants that dataset.
k8spups.passport.enabled=${K8SPUPS_PASSPORT_ENABLED:false}
# Where the Visas of a user come from: "issuer" (the controller fetches the Passport from passport-url), "userinfo" (the Visas
# are taken from the claim ga4gh_passport_v1 of the UserInfo response of the user's login, when the user starts a tool), or both.
# The source "userinfo" needs quarkus.oidc.authentication.user-info-required=true and the scope ga4gh_passport_v1 in
# quarkus.oidc.authentication.scopes, and a Keycloak that puts the Visas in that claim.
k8spups.passport.sources=${K8SPUPS_PASSPORT_SOURCES:issuer}
k8spups.passport.passport-url=${K8SPUPS_PASSPORT_URL:}
k8spups.passport.trusted-issuer=${K8SPUPS_PASSPORT_TRUSTED_ISSUER:}
k8spups.passport.jwks-uri=${K8SPUPS_PASSPORT_JWKS_URI:}
k8spups.passport.dataset-prefix=${K8SPUPS_PASSPORT_DATASET_PREFIX:}
k8spups.passport.accepted-by=${K8SPUPS_PASSPORT_ACCEPTED_BY:dac}
k8spups.passport.trusted-sources=${K8SPUPS_PASSPORT_TRUSTED_SOURCES:}
k8spups.passport.cache-seconds=${K8SPUPS_PASSPORT_CACHE_SECONDS:30}

# S3 access for the datasets that Visas grant (needs k8spups.passport.enabled=true). The data is in an S3 server
# (MinIO) with one read-only policy per dataset, named <policy-prefix><dataset>. The controller makes a signed token
# that names those policies and exchanges it at the STS endpoint of the S3 server (AssumeRoleWithWebIdentity) for
# temporary credentials, which go to the Pod as AWS_* environment variables. The S3 server trusts the key
# published under <issuer>/.well-known/openid-configuration and <issuer>/jwks.json (resource S3OidcResource).
k8spups.passport.s3.enabled=${K8SPUPS_PASSPORT_S3_ENABLED:false}
k8spups.passport.s3.endpoint=${K8SPUPS_PASSPORT_S3_ENDPOINT:}
k8spups.passport.s3.bucket=${K8SPUPS_PASSPORT_S3_BUCKET:}
k8spups.passport.s3.issuer=${K8SPUPS_PASSPORT_S3_ISSUER:}
k8spups.passport.s3.audience=${K8SPUPS_PASSPORT_S3_AUDIENCE:k8s-pups}
k8spups.passport.s3.policy-prefix=${K8SPUPS_PASSPORT_S3_POLICY_PREFIX:jga-read-}
k8spups.passport.s3.duration-seconds=${K8SPUPS_PASSPORT_S3_DURATION_SECONDS:900}
k8spups.passport.s3.signing-key-file=${K8SPUPS_PASSPORT_S3_SIGNING_KEY_FILE:}
k8spups.passport.s3.public-key-file=${K8SPUPS_PASSPORT_S3_PUBLIC_KEY_FILE:}
