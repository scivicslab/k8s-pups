<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{title} - Datasets</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #F8FAFC; color: #1E293B; margin: 0; padding: 24px 32px; }
        h1 { font-size: 1.4rem; } h2 { font-size: 1.1rem; margin-top: 28px; }
        table { border-collapse: collapse; background: #fff; width: 100%; }
        th, td { border: 1px solid #E2E8F0; padding: 6px 10px; text-align: left; font-size: .9rem; }
        th { background: #FFF7ED; }
        form.inline { display: inline; }
        input, select, button { font-size: .9rem; padding: 4px 8px; }
        .msg { background: #E0F2FE; border: 1px solid #7DD3FC; padding: 8px 12px; margin: 12px 0; word-break: break-word; }
        .note { color: #64748B; font-size: .85rem; }
        .pager { margin: 10px 0; }
        nav a { margin-right: 14px; }
    </style>
</head>
<body>
<nav>
    <a href="{basePath}/dashboard">&larr; Dashboard</a>
    <a href="{basePath}/datasets" id="nav-datasets">Datasets</a>
    <a href="{basePath}/datasets/users" id="nav-users">Users</a>
</nav>
{#if msg}<div class="msg" id="dataset-msg">{msg}</div>{/if}
{#insert content}{/insert}
</body>
</html>
