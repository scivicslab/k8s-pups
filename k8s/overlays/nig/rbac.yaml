---
# Role in user-pods namespace: manage Pods and Services
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-pups-pod-manager
  namespace: user-pods
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "configmaps"]
    verbs: ["create", "delete", "get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-pups-pod-manager-binding
  namespace: user-pods
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: k8s-pups
roleRef:
  kind: Role
  name: k8s-pups-pod-manager
  apiGroup: rbac.authorization.k8s.io
---
# Role in the HTTPRoute namespace: manage HTTPRoutes and SecurityPolicies.
# This namespace must match K8SPUPS_HTTPROUTE_NAMESPACE on the Deployment, which
# is where the Gateway that serves /pups lives (k8s-pups-gateway, NodePort 31084).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-pups-route-manager
  namespace: k8s-pups
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["securitypolicies"]
    verbs: ["create", "delete", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-pups-route-manager-binding
  namespace: k8s-pups
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: k8s-pups
roleRef:
  kind: Role
  name: k8s-pups-route-manager
  apiGroup: rbac.authorization.k8s.io
---
# Role in the controller namespace: read the tool-registry ConfigMap, which lists
# the dynamically registered tools.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-pups-config-reader
  namespace: k8s-pups
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-pups-config-reader-binding
  namespace: k8s-pups
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: k8s-pups
roleRef:
  kind: Role
  name: k8s-pups-config-reader
  apiGroup: rbac.authorization.k8s.io
---
# ClusterRole: read node status and metrics (cluster-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-pups-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "resourcequotas"]
    verbs: ["list"]
  # NFS-backed user storage (nfs-k8s, nfs-home) is a hand-built PersistentVolume
  # bound to the user's PVC, and PersistentVolume is cluster-scoped. Without these
  # verbs the controller cannot create a user's default storage, so the first
  # launch of any tool fails.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-pups-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: vault-auth
    namespace: k8s-pups
roleRef:
  kind: ClusterRole
  name: k8s-pups-node-reader
  apiGroup: rbac.authorization.k8s.io
