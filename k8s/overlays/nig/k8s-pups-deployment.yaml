apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-pups-controller
  namespace: k8s-pups
  labels:
    app: k8s-pups-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-pups-controller
  template:
    metadata:
      labels:
        app: k8s-pups-controller
    spec:
      serviceAccountName: vault-auth
      volumes:
      - name: vault-secrets
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: k8s-pups-spc
      containers:
      - name: k8s-pups
        image: k8s-pups
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for vault secrets..."
          while [ ! -f /vault/secrets/oidc-client-secret ]; do sleep 1; done
          while [ ! -f /vault/secrets/ldap-bind-password ]; do sleep 1; done
          echo "Vault secrets available"
          export K8S_PUPS_OIDC_SECRET=$(cat /vault/secrets/oidc-client-secret)
          export K8SPUPS_WORKSPACE_LDAP_BIND_PASSWORD=$(cat /vault/secrets/ldap-bind-password)
          exec java -Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager -jar /deployments/quarkus-run.jar
        volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
          readOnly: true
        env:
        - name: QUARKUS_OIDC_AUTH_SERVER_URL
          value: "http://keycloak.sc-account.svc:8080/sc-auth/realms/sc-account"
        - name: K8SPUPS_UNLIMITED_USERS
          value: "testadmin,devteam"
        - name: K8SPUPS_ENABLED_PLUGINS
          value: "ai-workspace,guacamole,kali,jupyter-lab,file-browser,storage-settings,pdf-ocr,compliance-tracer,quarkus-exdb2"
        - name: K8SPUPS_USER_PODS_ALLOWED_NODES
          value: "stonefly513,stonefly522"
        # Tool images are named ${REGISTRY}/<image>; without this they resolve to the
        # placeholder registry in application.properties and no tool Pod can pull.
        - name: K8SPUPS_REGISTRY
          value: "192.168.5.13:32000"
        # Must name the namespace holding the Gateway that serves /pups. The controller
        # creates sub-tool HTTPRoutes there, and the route-manager Role is bound there.
        - name: K8SPUPS_HTTPROUTE_NAMESPACE
          value: "k8s-pups"
        - name: K8SPUPS_GATEWAY_NAMES
          value: "k8s-pups-gateway"
        # NFS server for user storage. The default in application.properties is an
        # address from the previous network and does not answer.
        - name: K8SPUPS_NFS_K8S_SERVER
          value: "192.168.5.20"
        - name: K8SPUPS_WORKSPACE_NFS_SERVER
          value: "192.168.5.20"
        - name: K8SPUPS_WORKSPACE_LDAP_URL
          value: "ldap://ldap-unit2.sc-account.svc:389"
        - name: K8SPUPS_WORKSPACE_LDAP_BASE_DN
          value: "dc=nig,dc=ac,dc=jp"
        # Logout builds the Keycloak end-session URL from these. The defaults point at
        # a host that no longer exists, which made logout hang.
        - name: K8SPUPS_SESSION_OIDC_ISSUER
          value: "https://192.168.5.25/sc-auth/realms/sc-account"
        - name: K8SPUPS_SESSION_OIDC_AUTHORIZATION_ENDPOINT
          value: "https://192.168.5.25/sc-auth/realms/sc-account/protocol/openid-connect/auth"
        - name: K8SPUPS_SESSION_OIDC_TOKEN_ENDPOINT
          value: "http://keycloak.sc-account.svc:8080/sc-auth/realms/sc-account/protocol/openid-connect/token"
        - name: K8SPUPS_SESSION_OIDC_JWKS_URI
          value: "http://keycloak.sc-account.svc:8080/sc-auth/realms/sc-account/protocol/openid-connect/certs"
        - name: K8SPUPS_SESSION_OIDC_REDIRECT_BASE_URL
          value: "https://192.168.5.25"
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /pups/q/health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /pups/q/health/ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
