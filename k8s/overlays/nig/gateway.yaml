# EnvoyProxy: pin NodePort 31084 for HAProxy routing (backend k8s_pups_gateway)
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: k8s-pups-proxy
  namespace: k8s-pups
spec:
  logging:
    level:
      default: warn
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
              - name: http-80
                nodePort: 31084
                port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: k8s-pups-gateway
  namespace: k8s-pups
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: k8s-pups-proxy
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
---
# HTTPRoute: /pups -> k8s-pups-controller:8080
# RequestHeaderModifier sets X-Forwarded-Proto because Envoy Gateway
# overwrites it based on listener protocol (HTTP), but the real client
# connection is HTTPS terminated at HAProxy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: k8s-pups-route
  namespace: k8s-pups
spec:
  parentRefs:
  - name: k8s-pups-gateway
  rules:
  - timeouts:
      request: 3600s
    matches:
    - path:
        type: PathPrefix
        value: /pups
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-Proto
          value: https
    backendRefs:
    - name: k8s-pups-controller
      port: 8080
  # Tools inside a session Pod generate asset and API URLs from PUPS_SESSION_PATH,
  # which is /session/{id}/ and carries no deployment root path. Requests therefore
  # arrive at the gateway without the /pups prefix; this rule puts it back so they
  # reach the controller's session proxy. Without it the tool page loads no assets.
  - timeouts:
      request: 3600s
    matches:
    - path:
        type: PathPrefix
        value: /session
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        set:
        - name: X-Forwarded-Proto
          value: https
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /pups/session
    backendRefs:
    - name: k8s-pups-controller
      port: 8080
